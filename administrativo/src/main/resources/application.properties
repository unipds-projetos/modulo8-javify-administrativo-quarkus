quarkus.application.name=administrativo

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/javify-db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# DevServices desligados: o banco vem do docker-compose.yml na raiz do repo
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true
# update: o Hibernate cria o que falta no schema montado pelos scripts das aulas 2.x.
# E assim que a tabela cartao_credito aparece - so a entidade CartaoCredito existe.
quarkus.hibernate-orm.schema-management.strategy=update
# Mesma convencao de nomes do Spring Boot: camelCase da entidade -> snake_case da tabela
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
